<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Analytics | Come N' Meatshop</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="app-header"></header><main class="page"><div id="global-message" class="notice" hidden></div>
<div class="page-header"><div><h1 data-i18n="analytics">Analytics</h1><p class="subtitle">Admin-only sales comparison and inventory insights</p></div></div>
<form id="analytics-filters" class="toolbar"><label>From <input name="from" type="date" required></label><label>To <input name="to" type="date" required></label><select name="group"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select><button class="button" type="submit">Apply</button></form>
<section id="analytics-summary" class="grid"></section>
<section class="card chart-box"><canvas id="analytics-chart" aria-label="Sales analytics"></canvas></section>
<section class="grid" style="margin-top:16px"><article class="card col-6"><h2>Top products</h2><div id="top-products"></div></article><article class="card col-6"><h2>Top categories</h2><div id="top-categories"></div></article></section>
</main><script type="module" src="js/analytics.js"></script></body></html>
