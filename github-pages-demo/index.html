<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Come N' Meatshop internal inventory and POS">
    <title>Come N' Meatshop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-wrap"><p id="entry-message" class="notice">Checking your session…</p></main>
    <script type="module">
        import { isSupabaseConfigured, supabase } from './js/supabase.js';
        const status = document.getElementById('entry-message');
        if (!isSupabaseConfigured || !supabase) {
            status.textContent = 'Configure your Supabase URL and publishable key in js/supabase.js to get started.';
        } else {
            const { data, error } = await supabase.auth.getSession();
            if (error) {
                status.textContent = error.message;
            } else if (data.session) {
                location.replace('dashboard.html');
            } else {
                location.replace('login.html');
            }
        }
    </script>
</body>
</html>
