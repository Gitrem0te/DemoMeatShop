<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard | Come N' Meatshop</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="app-header"></header><main class="page"><div id="global-message" class="notice" hidden></div>
<div class="page-header"><div><h1 data-i18n="dashboard">Dashboard</h1><p class="subtitle">Today's activity and inventory overview</p></div></div>
<section class="grid">
    <article class="card col-3"><span class="stat-label">Today's sales</span><strong class="stat-value" id="today-total">—</strong><span id="today-count" class="muted"></span></article>
    <article class="card col-3"><span class="stat-label">This month's sales</span><strong class="stat-value" id="month-total">—</strong><span id="month-count" class="muted"></span></article>
    <article class="card col-3"><span class="stat-label">Active products</span><strong class="stat-value" id="active-products">—</strong></article>
    <article class="card col-3"><span class="stat-label">Inventory value</span><strong class="stat-value" id="inventory-value">—</strong></article>
    <article class="card col-4"><span class="stat-label">Low / out of stock</span><strong class="stat-value"><span id="low-count">—</span> / <span id="out-count">—</span></strong></article>
    <article class="card col-4"><span class="stat-label">Near expiry</span><strong class="stat-value" id="near-expiry">—</strong></article>
    <article class="card col-4"><span class="stat-label">Quick links</span><p><a href="sales.html">Record a sale</a> · <a href="inventory.html">Open inventory</a></p></article>
    <article class="card col-6"><h2>Low-stock products</h2><div id="low-items" class="table-wrap"></div></article>
    <article class="card col-6"><h2>Recent sales</h2><div id="recent-sales" class="table-wrap"></div></article>
</section>
</main><script type="module" src="js/admin.js"></script></body></html>
