<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product | Come N' Meatshop</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="app-header"></header><main class="page"><div id="global-message" class="notice" hidden></div>
<div class="page-header"><div><h1 id="product-form-title">Add product</h1><p class="subtitle">Product details and initial stock</p></div><a href="inventory.html">Back to inventory</a></div>
<form id="product-form" class="card">
    <div id="form-message" class="notice" hidden></div><div class="grid">
        <div class="field col-6"><label for="name">Name *</label><input id="name" name="name" required maxlength="150"></div>
        <div class="field col-6"><label for="category_id">Category</label><select id="category_id" name="category_id"><option value="">Uncategorized</option></select></div>
        <div class="field col-4"><label for="meat_type">Meat type</label><input id="meat_type" name="meat_type"></div>
        <div class="field col-4"><label for="price">Price</label><input id="price" name="price" type="number" min="0" step="0.01" required></div>
        <div class="field col-4"><label for="unit">Unit</label><select id="unit" name="unit"><option>kg</option><option>piece</option><option>pack</option><option>tray</option></select></div>
        <div class="field col-4"><label for="stock_quantity">Initial stock (new product only)</label><input id="stock_quantity" name="stock_quantity" type="number" min="0" step="0.001" value="0"></div>
        <div class="field col-4"><label for="min_stock_level">Minimum stock</label><input id="min_stock_level" name="min_stock_level" type="number" min="0" step="0.001" value="10"></div>
        <div class="field col-4"><label for="expiration_date">Expiration date</label><input id="expiration_date" name="expiration_date" type="date"></div>
        <div class="field col-6"><label for="barcode">Barcode</label><input id="barcode" name="barcode"></div>
        <div class="field col-6"><label for="supplier">Supplier</label><input id="supplier" name="supplier"></div>
        <div class="field col-12"><label for="description">Description</label><textarea id="description" name="description"></textarea></div>
        <div class="field col-6"><label for="image">Product image</label><input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>Stored in the private products bucket.</small></div>
        <div class="field col-6"><label for="status">Status</label><select id="status" name="status"><option>Active</option><option>Inactive</option><option>Archived</option><option>Deleted</option></select></div>
    </div><div class="actions"><button class="button" type="submit" data-i18n="save">Save</button><a class="button button-outline" href="inventory.html" data-i18n="cancel">Cancel</a></div>
</form></main><script type="module" src="js/inventory.js"></script></body></html>
