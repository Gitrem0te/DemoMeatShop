<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff account | Come N' Meatshop</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="app-header"></header><main class="page"><div id="global-message" class="notice" hidden></div>
<div class="page-header"><div><h1 id="user-form-title">Add staff</h1><p class="subtitle">Staff credentials are managed by Supabase Auth</p></div><a href="users.html">Back to users</a></div>
<form id="user-form" class="card" style="max-width:720px"><div id="user-form-message" class="notice" hidden></div>
    <div class="grid">
        <div class="field col-6"><label for="full_name">Full name *</label><input id="full_name" name="full_name" required></div>
        <div class="field col-6"><label for="username">Username *</label><input id="username" name="username" required></div>
        <div class="field col-6"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
        <div class="field col-6"><label for="phone">Phone</label><input id="phone" name="phone"></div>
        <div class="field col-6"><label for="password">Temporary password <span id="password-required">*</span></label><input id="password" name="password" type="password" minlength="6"><small>Required for new accounts; leave blank to keep an existing password.</small></div>
        <div class="field col-3"><label for="language_preference">Language</label><select id="language_preference" name="language_preference"><option value="en">English</option><option value="fil">Filipino</option></select></div>
        <div class="field col-3"><label for="status">Status</label><select id="status" name="status"><option>Active</option><option>Inactive</option><option>Archived</option><option>Deleted</option></select></div>
    </div><button class="button" type="submit">Save staff account</button>
</form></main><script type="module" src="js/users.js"></script></body></html>
