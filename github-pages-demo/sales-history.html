<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales history | Come N' Meatshop</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="app-header"></header><main class="page"><div id="global-message" class="notice" hidden></div>
<div class="page-header"><div><h1 data-i18n="history">Sales History</h1><p class="subtitle">Search receipts and correct sales</p></div><a class="button" href="sales.html">Record sale</a></div>
<form id="sales-filters" class="toolbar">
    <input name="q" type="search" placeholder="Receipt or customer">
    <select name="status"><option value="">All statuses</option><option>Completed</option><option>Edited</option><option>Voided</option><option>Deleted</option></select>
    <input name="from" type="date" aria-label="From date"><input name="to" type="date" aria-label="To date">
    <button class="button button-outline" type="submit">Filter</button>
</form>
<section class="card table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Cashier</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead><tbody id="sales-rows"><tr><td colspan="8">Loading…</td></tr></tbody></table></section>
</main><script type="module" src="js/orders.js"></script></body></html>
