<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications | Come N' Meatshop</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="app-header"></header><main class="page"><div id="global-message" class="notice" hidden></div>
<div class="page-header"><div><h1 data-i18n="notifications">Notifications</h1><p class="subtitle">Your in-app inventory and sales alerts</p></div><div class="actions"><button id="mark-all-read" class="button button-outline">Mark all read</button><button id="clear-read" class="button button-outline">Clear read</button></div></div>
<div class="toolbar"><select id="notification-filter"><option value="all">All notifications</option><option value="unread">Unread</option><option value="read">Read</option></select></div>
<section id="notification-list" class="grid"></section>
</main><script type="module" src="js/notifications.js"></script></body></html>
